[workspace]
resolver = "3"
members = ["crates/wire", "crates/core", "crates/cli", "crates/relay"]
# Die Tauri-App baut nur mit Android-SDK oder WebKitGTK und hat einen eigenen
# Abhängigkeitsbaum. Sie bleibt bis M3 außerhalb dieses Workspace, damit der
# Ablauf "Prüfen" schlank bleibt.
exclude = ["app"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# 1.89 for file locks in std (lz-core store).
rust-version = "1.89"
repository = "https://github.com/irgendwer92/Are-You-Alive-"
publish = false

[workspace.dependencies]
lz-wire = { path = "crates/wire" }
lz-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
