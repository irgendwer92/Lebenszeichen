name: Android release

# Builds the signed release APK. Only for a tag v* and by hand, never for
# pull requests: the key lives in the environment "release", limited to main
# and tags v*. Setup in docs/android-release.md.
#
# Tag: versionCode by Tauri's formula (0.1.0 → 1000), the version in the tag
# must match tauri.conf.json, the APK goes into a draft release.
# By hand: versionCode = run number, for testing only, artifact only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: Signed APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      # For the draft release on a tag.
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Key present?
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Key missing in the environment release; see docs/android-release.md"
            exit 1
          fi

      - name: Determine the version
        run: |
          set -euo pipefail
          version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"
              exit 1
            fi
          else
            echo "CONFIG={\"bundle\":{\"android\":{\"versionCode\":$GITHUB_RUN_NUMBER}}}" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Pick Java and NDK of the runner
        run: |
          echo "JAVA_HOME=${JAVA_HOME_21_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: release

      - name: Gradle-Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/android/kotlin/build.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install the Tauri CLI
        run: npm ci

      - name: Generate the Android project
        run: npm run tauri android init -- --ci --skip-targets-install

      # Without --debug: Rust optimized, R8 shrinks the Java part. Gradle does
      # not sign; the next step does.
      - name: Build the APK
        env:
          LZ_DEFAULT_RELAY: ${{ vars.LZ_DEFAULT_RELAY }}
        run: |
          set -euo pipefail
          if [ -n "${CONFIG:-}" ]; then set -- --config "$CONFIG"; fi
          npm run tauri android build -- --ci --apk --target aarch64 "$@"

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          unsigned="$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' -print -quit)"
          test -n "$unsigned"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          # 16 KB pages for the native library (Android 15 and newer).
          "$build_tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          apk="$RUNNER_TEMP/lebenszeichen-$VERSION-arm64.apk"
          # Passwords only through the environment, never on the command line.
          "$build_tools/apksigner" sign \
            --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$keystore" "$RUNNER_TEMP/aligned.apk"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the APK
        run: |
          set -euo pipefail
          scripts/check-apk.sh "$APK"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          echo "::group::Certificate (compare with keytool -list -v)"
          "$build_tools/apksigner" verify --verbose --print-certs "$APK" | grep -E "Verified using|SHA-256"
          echo "::endgroup::"
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          cat "$APK.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: lebenszeichen-release-apk
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Lebenszeichen $VERSION" \
            --notes "Signed APK for Android (arm64). Checksum in the .sha256 file, certificate in the run under \"Check the APK\"." \
            "$APK" "$APK.sha256"
