# Prüft Abhängigkeiten auf Sicherheitsmeldungen, Lizenzen und Herkunft.
# Lokal ausführen mit: cargo deny check

[graph]
all-features = true
# Nur die Zielsysteme, für die gebaut wird. Sonst zählen Abhängigkeiten
# anderer Systeme mit, etwa webpki-root-certs (CDLA-Permissive-2.0), das
# rustls-platform-verifier nur für WebAssembly braucht.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-linux-android",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2

[licenses]
version = 2
# Lizenzen, die sich mit GPL-3.0-or-later und AGPL-3.0-or-later vertragen.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "GPL-3.0-or-later",
    "AGPL-3.0-or-later",
]
unused-allowed-license = "allow"

[licenses.private]
# Die eigenen, nicht veröffentlichten Crates werden nicht geprüft.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
