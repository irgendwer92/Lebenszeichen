# Checks dependencies for advisories, licenses and sources.
# Run locally with: cargo deny check

[graph]
all-features = true
# Only the targets we build for. Otherwise dependencies of other systems
# count too, such as webpki-root-certs (CDLA-Permissive-2.0), which
# rustls-platform-verifier needs only for WebAssembly.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-linux-android",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2

[licenses]
version = 2
# Licenses compatible with GPL-3.0-or-later and AGPL-3.0-or-later.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "GPL-3.0-or-later",
    "AGPL-3.0-or-later",
]
unused-allowed-license = "allow"

[licenses.private]
# Our own unpublished crates are not checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
