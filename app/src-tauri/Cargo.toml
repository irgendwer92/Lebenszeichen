[package]
name = "lebenszeichen-app"
description = "Lebenszeichen-App: Tauri-Hülle für den Linux-Desktop und Android"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/irgendwer92/Lebenszeichen"
publish = false

# The Kotlin layer loads this library by name (CoreBridge.kt), so the name
# must stay in sync with it.
[lib]
name = "lebenszeichen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-lebenszeichen = { path = "../android" }
lz-core = { path = "../../crates/core" }
lz-client = { path = "../../crates/client" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

# Notifications over D-Bus (desktop/notify.rs); already in the build through
# tauri-plugin-single-instance.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
# Same major line as Tauri itself uses, so only one copy ends up in the build.
jni = "0.21"
# Where Tao keeps the Java VM and the application context.
ndk-context = "0.1"
# Same version as in lz-client; set up with the context in jni_bridge.rs.
rustls-platform-verifier = "0.6"
# Answers to the Kotlin layer (jni_bridge.rs).
serde_json = "1"

# The prototype is sideloaded as a debug build. Without debug information the
# library and with it the APK stay small.
[profile.dev]
debug = false
strip = "debuginfo"
