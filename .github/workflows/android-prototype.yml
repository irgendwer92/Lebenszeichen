name: Android debug

# Builds the debug APK of the Android app. Pull requests compile the
# Android part only here.
#
# Runs on pull requests that touch the app, the core or dependencies, and by
# hand (Actions → Android debug → Run workflow, or:
# gh workflow run android-prototype.yml --ref <branch>).

on:
  pull_request:
    paths:
      - "app/**"
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/android-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-prototype-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: Debug-APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Pick Java and NDK of the runner
        run: |
          echo "JAVA_HOME=${JAVA_HOME_21_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Gradle-Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/android/kotlin/build.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # Without this cache every run creates a new debug key, and a new APK
      # could not be installed over the old one.
      - name: Keep the debug key between runs
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Install the Tauri CLI
        run: npm ci

      - name: Generate the Android project
        run: npm run tauri android init -- --ci --skip-targets-install

      - name: Build the APK
        env:
          LZ_DEFAULT_RELAY: ${{ vars.LZ_DEFAULT_RELAY }}
        run: npm run tauri android build -- --ci --debug --apk --target aarch64

      - name: Check the APK
        run: |
          set -euo pipefail
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "$RUNNER_TEMP/lebenszeichen-arm64-debug.apk"
          scripts/check-apk.sh "$RUNNER_TEMP/lebenszeichen-arm64-debug.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: lebenszeichen-arm64-debug-apk
          path: ${{ runner.temp }}/lebenszeichen-arm64-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
