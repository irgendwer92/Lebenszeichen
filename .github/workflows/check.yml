name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, Clippy, Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  android-strings:
    name: Android strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: app/scripts/check-android-strings.sh

  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
      # The app lives outside the workspace and has its own lockfile.
      # Dependabot reports advisories for its GTK dependencies; here count
      # licenses, sources and bans from the same deny.toml. The action passes
      # extra arguments only as a single one, hence cargo-deny directly.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Dependencies of the desktop app
        run: >-
          cargo deny --manifest-path app/src-tauri/Cargo.toml --all-features
          --config deny.toml check licenses bans sources

  desktop:
    name: Desktop app (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        env:
          LZ_DEFAULT_RELAY: ${{ vars.LZ_DEFAULT_RELAY }}
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        env:
          LZ_DEFAULT_RELAY: ${{ vars.LZ_DEFAULT_RELAY }}
        run: cargo test --locked

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Clippy (desktop app)
        working-directory: app/src-tauri
        env:
          LZ_DEFAULT_RELAY: ${{ vars.LZ_DEFAULT_RELAY }}
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests (desktop app)
        working-directory: app/src-tauri
        env:
          LZ_DEFAULT_RELAY: ${{ vars.LZ_DEFAULT_RELAY }}
        run: cargo test --locked
