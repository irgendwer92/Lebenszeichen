name: Android-Prototyp

# Baut die Debug-APK des Durchstichs aus M1. Der Ablauf ist die einzige
# Stelle, an der der Android-Teil übersetzt wird; siehe docs/m1-durchstich.md.
#
# Läuft bei Pull Requests, die App, Kern oder Abhängigkeiten berühren, und
# weiter von Hand (Actions → Android-Prototyp → Run workflow, oder:
# gh workflow run android-prototype.yml --ref <zweig>).

on:
  pull_request:
    paths:
      - "app/**"
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/android-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-prototype-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    name: Debug-APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Java und NDK des Runners wählen
        run: |
          echo "JAVA_HOME=${JAVA_HOME_21_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Gradle-Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/android/kotlin/build.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      # Ohne diesen Cache erzeugt jeder Lauf einen neuen Debug-Schlüssel, und
      # eine neue APK ließe sich nicht über die alte installieren.
      - name: Debug-Schlüssel zwischen den Läufen behalten
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Tauri-CLI installieren
        run: npm ci

      - name: Android-Projekt erzeugen
        run: npm run tauri android init -- --ci --skip-targets-install

      - name: APK bauen
        run: npm run tauri android build -- --ci --debug --apk --target aarch64

      - name: APK prüfen
        run: |
          set -euo pipefail
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" "$RUNNER_TEMP/lebenszeichen-m1-arm64-debug.apk"
          apk="$RUNNER_TEMP/lebenszeichen-m1-arm64-debug.apk"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          unpacked="$RUNNER_TEMP/apk"
          mkdir -p "$unpacked"
          unzip -q -o "$apk" -d "$unpacked"

          echo "::group::Native Bibliothek"
          library="$unpacked/lib/arm64-v8a/liblebenszeichen_lib.so"
          ls -l "$unpacked"/lib/*/
          "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" -D --defined-only "$library" > "$RUNNER_TEMP/symbols.txt"
          grep -F "Java_io_github_irgendwer92_lebenszeichen_droid_CoreBridge_marker" "$RUNNER_TEMP/symbols.txt"
          echo "::endgroup::"

          echo "::group::Manifest"
          "$build_tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$RUNNER_TEMP/manifest.txt"
          for needle in \
            droid.PushServiceImpl droid.ReactionReceiver droid.RequestActivity \
            android.permission.USE_FULL_SCREEN_INTENT android.permission.POST_NOTIFICATIONS \
            org.unifiedpush.android.connector.MESSAGE org.unifiedpush.android.connector.PUSH_EVENT \
            androidx.work.impl.background.systemjob.SystemJobService; do
            grep -m 1 -F "$needle" "$RUNNER_TEMP/manifest.txt" || { echo "fehlt im Manifest: $needle"; exit 1; }
          done
          "$build_tools/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|native-code)" || true
          echo "::endgroup::"

          echo "::group::Klassen der Kotlin-Schicht"
          for class in CoreBridge PushServiceImpl ReactionReceiver RequestActivity AnswerWorker LebenszeichenPlugin; do
            grep -a -l -F "Lio/github/irgendwer92/lebenszeichen/droid/$class;" "$unpacked"/classes*.dex \
              || { echo "fehlt im Bytecode: $class"; exit 1; }
          done
          echo "::endgroup::"

          echo "::group::Signatur und Versionen"
          "$build_tools/apksigner" verify --print-certs "$apk" | grep -E "SHA-256|DN" || true
          find ~/.gradle/caches \( -name "connector-*.aar" -o -name "work-runtime-*.aar" \) | sed 's|.*/||' | sort -u
          ls -l "$apk"
          echo "::endgroup::"

      - uses: actions/upload-artifact@v7
        with:
          name: lebenszeichen-m1-arm64-debug-apk
          path: ${{ runner.temp }}/lebenszeichen-m1-arm64-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
