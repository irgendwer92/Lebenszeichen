# nginx on the host, in front of compose.yaml, e.g. as
# /etc/nginx/conf.d/lebenszeichen.conf. Replace the two names and the
# certificate paths (for example from certbot: certbot certonly --nginx
# -d relay.example.org -d ntfy.example.org).
#
# Access logs are off for both hosts. Error logs stay on; they carry no
# requests in normal operation.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.example.org ntfy.example.org;
    access_log off;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay.example.org;
    access_log off;

    ssl_certificate     /etc/letsencrypt/live/relay.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        # The live connection (/v1/stream) is a WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # The clients ping every 30 seconds; allow some slack.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ntfy.example.org;
    access_log off;

    ssl_certificate     /etc/letsencrypt/live/ntfy.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ntfy.example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ntfy keeps subscriptions open for a long time.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3m;
        proxy_send_timeout 3m;
        client_max_body_size 20m;
    }
}
