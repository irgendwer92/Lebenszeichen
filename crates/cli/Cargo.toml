[package]
name = "lz-cli"
description = "Lebenszeichen-Client ohne Oberfläche"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "lz"
path = "src/main.rs"

[dependencies]
lz-core.workspace = true
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
# TLS with ring only: aws-lc-rs brings a license that is not on the list in
# deny.toml. Root certificates come from the system.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util"] }

[lints]
workspace = true
