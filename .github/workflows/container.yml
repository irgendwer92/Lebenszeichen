name: Container

# Builds the image of lz-server (deploy/docker/Dockerfile) and pushes it to
# ghcr.io/irgendwer92/lebenszeichen. Used by plain Docker and by the Home
# Assistant app (deploy/home-assistant).
#
# Tag v1.2.3: image tags 1.2.3 and sha-<short>.
# By hand (Actions → Container → Run workflow): the tag from the input
# (default "edge") and sha-<short>.
#
# amd64 only for now. aarch64 follows: add `platforms: linux/amd64,linux/arm64`
# plus docker/setup-qemu-action, or a native arm64 runner.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: edge

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/irgendwer92/lebenszeichen

jobs:
  image:
    name: Image (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # A tag v1.2.3 gives 1.2.3; by hand the input is used as it is.
          # No "latest": the Supervisor pulls the version of config.yaml.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
