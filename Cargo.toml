[workspace]
resolver = "3"
members = ["crates/wire", "crates/core", "crates/cli", "crates/relay"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/irgendwer92/Are-You-Alive-"
publish = false

[workspace.dependencies]
lz-wire = { path = "crates/wire" }
lz-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
