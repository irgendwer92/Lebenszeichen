[package]
name = "lz-server"
description = "Lebenszeichen as a service: listening, the local interface and a setup page"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "lz-server"
path = "src/main.rs"

[dependencies]
lz-client.workspace = true
lz-core.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rand_core = { version = "0.6.4", features = ["getrandom"] }
tempfile = "3"

[lints]
workspace = true
