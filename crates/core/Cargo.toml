[package]
name = "lz-core"
description = "Protocol, encryption, rule checks and storage of Lebenszeichen"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lz-wire = { workspace = true, features = ["serde"] }
crypto_box = { version = "0.9.1", default-features = false, features = ["salsa20", "seal", "rand_core"] }
rand_core = "0.6.4"
sha2 = { version = "0.10.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
rand_core = { version = "0.6.4", features = ["getrandom"] }

[lints]
workspace = true
