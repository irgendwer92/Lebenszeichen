name: Container

# Builds two images and pushes them to GHCR:
#
# - lz-server (deploy/docker/Dockerfile) as ghcr.io/irgendwer92/lebenszeichen.
#   Used by plain Docker and by the Home Assistant app (deploy/home-assistant).
#   amd64 only for now.
# - the relay (crates/relay/Dockerfile) as
#   ghcr.io/irgendwer92/lebenszeichen-relay, for self-hosters
#   (docs/self-hosting.md). amd64 and arm64, each built on a native runner
#   and joined into one multi-arch tag afterwards.
#
# Tag v1.2.3: image tags 1.2.3 and sha-<short>; the relay also 1.2 and latest.
# By hand (Actions → Container → Run workflow): the tag from the input
# (default "edge") and sha-<short>.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: edge

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/irgendwer92/lebenszeichen
  RELAY_IMAGE: ghcr.io/irgendwer92/lebenszeichen-relay

jobs:
  image:
    name: Image (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # A tag v1.2.3 gives 1.2.3; by hand the input is used as it is.
          # No "latest": the Supervisor pulls the version of config.yaml.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  relay:
    name: Relay image (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.RELAY_IMAGE }}

      # Pushed by digest only; the job "relay-manifest" gives it its tags.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: crates/relay/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.RELAY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=relay-${{ matrix.arch }}
          cache-to: type=gha,scope=relay-${{ matrix.arch }},mode=max

      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: relay-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  relay-manifest:
    name: Relay image (multi-arch tag)
    needs: relay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: relay-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.RELAY_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,format=short

      - name: Join the digests under the tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$RELAY_IMAGE@sha256:%s " *)

      - name: Show the image
        run: docker buildx imagetools inspect "$RELAY_IMAGE:$VERSION"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
